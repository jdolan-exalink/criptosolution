version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wanda
      POSTGRES_PASSWORD: wanda_password
      POSTGRES_DB: wandanarabot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://wanda:wanda_password@db:5432/wandanarabot
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./.env:/app/.env
    depends_on:
      - db
      - redis

  trader:
    build:
      context: .
      dockerfile: apps/trader/Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://wanda:wanda_password@db:5432/wandanarabot
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./.env:/app/.env
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://wanda:wanda_password@db:5432/wandanarabot
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
